<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>단아의 타로 관리자 — 상담 신청 내역 미리보기</title>

  <link rel="stylesheet" href="admin.css?v=2">
</head>
<body>

  <div id="login-panel" class="card hidden">

    <h1>🌙 단아의 타로</h1>
    <h2>관리자 로그인</h2>

    <input
      type="email"
      id="email"
      placeholder="이메일">

    <input
      type="password"
      id="password"
      placeholder="비밀번호">

    <button id="loginBtn">
      로그인
    </button>

    <p id="message"></p>

  </div>

  <div id="admin-panel" class="card hidden">

    <h1>🌙 단아의 타로 관리자</h1>

    <section id="applications-section">

      <div class="section-head">

        <h3>
          📩 상담 신청 내역
          <span id="applicationCount" class="count-badge hidden"></span>
        </h3>

        <button
          id="refreshApplicationsBtn"
          class="ghost-btn"
          type="button">
          새로고침
        </button>

      </div>

      <p id="applicationsNotice" class="notice-text" hidden></p>

      <div id="applicationList" class="application-list"></div>

    </section>

    <hr>

    <section>

      <h3>상담 상태</h3>

      <select id="statusSelect">
        <option>🟢 상담 가능</option>
        <option>🌙 상담중</option>
        <option>🔴 상담 종료</option>
      </select>

      <button id="saveStatusBtn">
        상태 저장
      </button>

    </section>

    <hr>

    <section>

      <h3>공지사항</h3>

      <textarea
        id="noticeInput"
        rows="5"
        placeholder="공지사항을 입력하세요"></textarea>

      <button id="saveNoticeBtn">
        공지 저장
      </button>

    </section>

    <hr>

    <section>

      <h3>후기 추가</h3>

      <textarea
        id="reviewInput"
        rows="4"
        placeholder="후기를 입력하세요"></textarea>

      <button id="addReviewBtn">
        후기 추가
      </button>

    </section>

    <hr>

    <section>

      <h3>후기 목록</h3>

      <div id="reviewList"></div>

    </section>

    <button id="logoutBtn">
      로그아웃
    </button>

  </div>

  <script type="module">

/* ===== 미리보기용 모의 Supabase (실제 코드 아님) ===== */
const MOCK_DATA = {
  status: [{ id: 1, status: "🟢 상담 가능" }],
  notice: [{ id: 1, content: "당일 예약가능합니다 💓\n11월부터 신년타로 봅니다." }],
  reviews: [
    { id: 2, content: "단아쌤 덕분에 재회했어요", created_at: "2026-11-16T12:00:00Z" }
  ],
  faq: [],
  applications: [
    {
      id: 3,
      name: "별빛",
      category: "신년타로 / 신년운세",
      duration: "30분 (30,000원)",
      concern: "올해 이직을 해도 괜찮을지, 지금 회사에 남는 게 나을지 고민이에요.\n내년 상반기 흐름이 궁금합니다.",
      preferred_date: "2026-11-20",
      preferred_time: "20:00",
      status: "대기",
      created_at: "2026-11-18T13:04:00Z"
    },
    {
      id: 2,
      name: "하늘",
      category: "연애·재회 상담",
      duration: "1시간 (60분 · 60,000원)",
      concern: "헤어진 지 두 달 된 사람과 다시 연락을 해도 될까요?",
      preferred_date: null,
      preferred_time: null,
      status: "확인됨",
      created_at: "2026-11-18T05:41:00Z"
    },
    {
      id: 1,
      name: "달",
      category: "Yes or No",
      duration: "Yes or No + 조언카드 (3,000원)",
      concern: null,
      preferred_date: "2026-11-19",
      preferred_time: "10:30",
      status: "완료",
      created_at: "2026-11-17T22:12:00Z"
    }
  ]
};

const PREVIEW_STATE = new URLSearchParams(location.search).get("state") || "full";

function mockQuery(table) {
  const api = {
    select() { return api; },
    eq() { return api; },
    order() {
      if (table === "applications" && PREVIEW_STATE === "missing") {
        return Promise.resolve({
          data: null,
          error: {
            code: "PGRST205",
            message: "Could not find the table 'public.applications' in the schema cache"
          }
        });
      }
      return Promise.resolve({ data: MOCK_DATA[table] || [], error: null });
    },
    single() {
      return Promise.resolve({ data: (MOCK_DATA[table] || [])[0] || null, error: null });
    },
    update() { return api; },
    insert() { return Promise.resolve({ data: null, error: null }); },
    delete() { return api; },
    then(resolve) { resolve({ data: null, error: null }); }
  };
  return api;
}

const supabase = {
  from: mockQuery,
  auth: {
    getUser: async () => ({ data: { user: { email: "aa95925551@gmail.com" } } }),
    getSession: async () => ({ data: { session: { access_token: "mock" } } }),
    signInWithPassword: async () => ({ error: null }),
    signOut: async () => {}
  }
};
/* ===== 모의 객체 끝 ===== */

const loginPanel = document.getElementById("login-panel");
const adminPanel = document.getElementById("admin-panel");

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");

const statusSelect = document.getElementById("statusSelect");
const saveStatusBtn = document.getElementById("saveStatusBtn");

const noticeInput = document.getElementById("noticeInput");
const saveNoticeBtn = document.getElementById("saveNoticeBtn");

const reviewInput = document.getElementById("reviewInput");
const addReviewBtn = document.getElementById("addReviewBtn");

const reviewList = document.getElementById("reviewList");

const applicationList = document.getElementById("applicationList");
const applicationsNotice = document.getElementById("applicationsNotice");
const applicationCount = document.getElementById("applicationCount");
const refreshApplicationsBtn = document.getElementById("refreshApplicationsBtn");

const logoutBtn = document.getElementById("logoutBtn");

function showAdmin() {
  loginPanel.classList.add("hidden");
  adminPanel.classList.remove("hidden");
}

function showLogin() {
  loginPanel.classList.remove("hidden");
  adminPanel.classList.add("hidden");
}

async function loadStatus() {
  const { data } = await supabase
    .from("status")
    .select("*")
    .eq("id", 1)
    .single();

  if (data) {
    statusSelect.value = data.status;
  }
}

async function loadNotice() {
  const { data } = await supabase
    .from("notice")
    .select("*")
    .eq("id", 1)
    .single();

  if (data) {
    noticeInput.value = data.content || "";
  }
}

async function loadReviews() {
  const { data } = await supabase
    .from("reviews")
    .select("*")
    .order("id", { ascending: false });

  reviewList.innerHTML = "";

  if (!data) return;

  data.forEach((review) => {
    const item = document.createElement("div");

    item.className = "review-item";

    item.innerHTML = `
  <p>${review.content}</p>

  <button class="edit-btn">
    수정
  </button>

  <button class="delete-btn">
    삭제
  </button>
`;

const editBtn = item.querySelector(".edit-btn");
const deleteBtn = item.querySelector(".delete-btn");
editBtn.addEventListener("click", async () => {
  const newContent = prompt("후기를 수정하세요.", review.content);

  if (newContent === null) return;

  if (!newContent.trim()) {
    alert("후기를 입력해주세요.");
    return;
  }

  const { error } = await supabase
    .from("reviews")
    .update({
      content: newContent.trim()
    })
    .eq("id", review.id);

  if (error) {
    alert(error.message);
    return;
  }

  alert("수정 완료");
  loadReviews();
});


    deleteBtn.addEventListener(
      "click",
      async () => {
        await supabase
          .from("reviews")
          .delete()
          .eq("id", review.id);

        loadReviews();
      }
    );

    reviewList.appendChild(item);
  });
}

/* =====================
   상담 신청 내역
===================== */

const APPLICATION_STATUSES = ["대기", "확인됨", "완료"];

function escapeHtml(str = "") {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function statusClass(status) {
  if (status === "완료") return "done";
  if (status === "확인됨") return "checked";
  return "waiting";
}

function statusBadge(status) {
  const value = status || "대기";
  return `<span class="status-badge ${statusClass(value)}">${escapeHtml(value)}</span>`;
}

function formatReceived(value) {
  if (!value) return "시간 미상";

  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value);

  try {
    const parts = new Intl.DateTimeFormat("ko-KR", {
      timeZone: "Asia/Seoul",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    }).formatToParts(date);

    const get = (type) => (parts.find((part) => part.type === type) || {}).value || "";
    return `${get("year")}.${get("month")}.${get("day")} ${get("hour")}:${get("minute")}`;
  } catch (error) {
    return date.toLocaleString("ko-KR");
  }
}

function formatPreferredDate(value) {
  if (!value) return "미정";

  const date = new Date(`${value}T00:00:00`);
  if (Number.isNaN(date.getTime())) return String(value);

  const names = ["일", "월", "화", "수", "목", "금", "토"];
  return `${value} (${names[date.getDay()]}요일)`;
}

function formatPreferredTime(value) {
  if (!value) return "미정";

  const [rawHour, rawMinute] = String(value).split(":");
  const hour = Number(rawHour);
  const minute = Number(rawMinute);

  if (Number.isNaN(hour) || Number.isNaN(minute)) return String(value);

  const mark = hour < 12 ? "오전" : "오후";
  const hour12 = hour % 12 === 0 ? 12 : hour % 12;
  return `${mark} ${hour12}:${String(minute).padStart(2, "0")}`;
}

function showApplicationsNotice(text) {
  if (!applicationsNotice) return;
  applicationsNotice.textContent = text;
  applicationsNotice.hidden = false;
}

function hideApplicationsNotice() {
  if (!applicationsNotice) return;
  applicationsNotice.textContent = "";
  applicationsNotice.hidden = true;
}

function isMissingTableError(error) {
  const code = (error && error.code) || "";
  const text = `${(error && error.message) || ""} ${(error && error.details) || ""}`;

  return (
    code === "PGRST205" ||
    code === "42P01" ||
    /could not find the table/i.test(text) ||
    /relation .* does not exist/i.test(text) ||
    /table .* does not exist/i.test(text)
  );
}

function describeApplicationsError(error) {
  if (isMissingTableError(error)) {
    return "상담 신청 테이블이 아직 생성되지 않았습니다. Supabase에 applications 테이블을 만들면 이곳에 신청 내역이 표시됩니다.";
  }

  const text = (error && error.message) || "";

  if (/row-level security|permission denied|jwt/i.test(text)) {
    return "신청 내역을 불러올 권한이 없습니다. Supabase의 RLS 정책을 확인해 주세요.";
  }

  return `신청 내역을 불러오지 못했습니다.${text ? ` (${text})` : ""}`;
}

function buildApplicationItem(application) {
  const item = document.createElement("div");
  item.className = "application-item";

  const status = application.status || "대기";
  const statuses = APPLICATION_STATUSES.includes(status)
    ? APPLICATION_STATUSES
    : [...APPLICATION_STATUSES, status];

  const when = `${formatPreferredDate(application.preferred_date)} · ${formatPreferredTime(
    application.preferred_time
  )}`;

  item.innerHTML = `
    <div class="application-head">
      <strong class="application-name">${escapeHtml(application.name || "이름 없음")}</strong>
      ${statusBadge(status)}
    </div>

    <p class="application-meta">
      ${escapeHtml(application.category || "상담 종류 미정")} · ${escapeHtml(
        application.duration || "미정"
      )}
    </p>

    <p class="application-meta">
      접수 ${escapeHtml(formatReceived(application.created_at))}
    </p>

    <p class="application-when">
      희망 일정 · ${escapeHtml(when)}
    </p>

    <p class="application-concern">${escapeHtml(
      application.concern || "고민 내용이 작성되지 않았습니다."
    )}</p>

    <div class="application-actions">
      <select class="application-status" aria-label="상담 신청 상태 변경">
        ${statuses
          .map(
            (value) =>
              `<option value="${escapeHtml(value)}"${
                value === status ? " selected" : ""
              }>${escapeHtml(value)}</option>`
          )
          .join("")}
      </select>

      <button class="delete-btn" type="button">삭제</button>
    </div>
  `;

  const statusSelectEl = item.querySelector(".application-status");
  const badgeEl = item.querySelector(".status-badge");
  const deleteBtn = item.querySelector(".delete-btn");

  statusSelectEl.addEventListener("change", async () => {
    const next = statusSelectEl.value;
    statusSelectEl.disabled = true;

    const { error } = await supabase
      .from("applications")
      .update({ status: next })
      .eq("id", application.id);

    statusSelectEl.disabled = false;

    if (error) {
      alert(`상태를 변경하지 못했습니다.\n${error.message}`);
      statusSelectEl.value = application.status || "대기";
      return;
    }

    application.status = next;
    badgeEl.className = `status-badge ${statusClass(next)}`;
    badgeEl.textContent = next;
  });

  deleteBtn.addEventListener("click", async () => {
    const label = application.name || "이";

    if (
      !confirm(`"${label}"님의 상담 신청 내역을 삭제할까요?\n삭제한 내역은 되돌릴 수 없습니다.`)
    ) {
      return;
    }

    deleteBtn.disabled = true;

    const { error } = await supabase.from("applications").delete().eq("id", application.id);

    deleteBtn.disabled = false;

    if (error) {
      alert(`삭제하지 못했습니다.\n${error.message}`);
      return;
    }

    loadApplications();
  });

  return item;
}

function renderApplications(applications) {
  if (!applicationList) return;

  applicationList.innerHTML = "";

  if (applicationCount) {
    applicationCount.textContent = String(applications.length);
    applicationCount.classList.toggle("hidden", applications.length === 0);
  }

  if (applications.length === 0) {
    const empty = document.createElement("p");
    empty.className = "application-empty";
    empty.textContent = "아직 접수된 상담 신청이 없습니다.";
    applicationList.appendChild(empty);
    return;
  }

  applications.forEach((application) => {
    applicationList.appendChild(buildApplicationItem(application));
  });
}

async function loadApplications() {
  if (!applicationList) return;

  const { data, error } = await supabase
    .from("applications")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    applicationList.innerHTML = "";
    if (applicationCount) applicationCount.classList.add("hidden");
    // 신청 내역 영역에만 안내를 띄우고, 다른 관리자 기능은 그대로 둡니다.
    showApplicationsNotice(describeApplicationsError(error));
    return;
  }

  hideApplicationsNotice();
  renderApplications(Array.isArray(data) ? data : []);
}

if (refreshApplicationsBtn) {
  refreshApplicationsBtn.addEventListener("click", async () => {
    refreshApplicationsBtn.disabled = true;
    await loadApplications();
    refreshApplicationsBtn.disabled = false;
  });
}

async function loadAll() {
  await loadApplications();
  await loadStatus();
  await loadNotice();
  await loadReviews();
}

loginBtn.addEventListener(
  "click",
  async () => {
    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value.trim();

    const { error } =
      await supabase.auth.signInWithPassword({
        email,
        password,
      });

   if (error) {
  message.textContent = error.message;
  return;
}

   const ADMIN_EMAIL = "aa95925551@gmail.com";

const {
  data: { user }
} = await supabase.auth.getUser();

if (user.email !== ADMIN_EMAIL) {
  await supabase.auth.signOut();
  alert("관리자만 접근 가능합니다.");
  return;
}

message.textContent = "";

showAdmin();

loadAll();
    
  }
);

saveStatusBtn.addEventListener(
  "click",
  async () => {
    await supabase
      .from("status")
      .update({
        status: statusSelect.value,
      })
      .eq("id", 1);

    alert("상태 저장 완료");
  }
);

saveNoticeBtn.addEventListener(
  "click",
  async () => {
    await supabase
      .from("notice")
      .update({
        content:
          noticeInput.value,
      })
      .eq("id", 1);

    alert("공지 저장 완료");
  }
);

addReviewBtn.addEventListener(
  "click",
  async () => {

    const content =
      reviewInput.value.trim();

    if (!content) return;

    const { data, error } = await supabase
      .from("reviews")
      .insert([
        {
          content,
        },
      ]);

    console.log("DATA", data);
    console.log("ERROR", error);

    if (error) {
      alert(error.message);
      return;
    }

    alert("후기 저장 완료");

    reviewInput.value = "";

    loadReviews();
  }
);

logoutBtn.addEventListener(
  "click",
  async () => {
    await supabase.auth.signOut();

    showLogin();
  }
);

async function init() {
  const {
    data: { session },
  } =
    await supabase.auth.getSession();

  if (session) {
    showAdmin();

    loadAll();
  }
}

showAdmin();
loadAll();

</script>
