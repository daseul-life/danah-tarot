<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>단아의 타로</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fff5f8;
      font-family: 'Apple SD Gothic Neo', sans-serif;
    }
    .section {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px;
    }
    .content-img {
      width: 100%;
      display: block;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <!-- 상단 예약 버튼 영역 -->
  <section class="section" style="text-align: center;">
    <a href="#" data-reserve style="display: block;">
      <img src="./images/top_banner.png" alt="상담 예약하기" class="content-img">
    </a>
  </section>

  <!-- PRICE (원본 요금표 이미지 100% 보존 - 맨 처음 상태) -->
  <section class="section">
    <a href="#" data-reserve style="display: block;">
      <img src="./images/price.png" alt="단아의 타로 상담 요금 안내" class="content-img">
    </a>
  </section>

  <!-- 하단 후기 영역 -->
  <section class="section" style="text-align: center;">
    <img src="./images/review.png" alt="상담 후기" class="content-img">
  </section>

</body>
</html>
